<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Revision Program - JEE Main 2027</title>
    
    <!-- Professional Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-canvas: #090d16;
            --card-surface: #131b2e;
            --card-surface-elevated: #1c2742;
            --brand-primary: #38bdf8;
            --brand-secondary: #f59e0b;
            --brand-accent: #10b981;
            --brand-urgent: #ef4444;
            --whatsapp-color: #25D366;
            --text-heading: #f8fafc;
            --text-body: #cbd5e1;
            --text-muted: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-highlight: rgba(56, 189, 248, 0.3);
            
            /* Professional Font Stacks */
            --font-eng: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-hindi-body: 'Noto Sans Devanagari', 'Inter', sans-serif;
            --font-hindi-serif: 'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-hindi-body);
            background-color: var(--bg-canvas);
            color: var(--text-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card-surface);
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            position: relative;
        }

        .header-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 60%, #312e81 100%);
            padding: 42px 32px 36px;
            text-align: center;
            position: relative;
            border-bottom: 2px solid var(--brand-secondary);
        }

        .institute-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--brand-secondary);
            color: var(--brand-secondary);
            font-family: var(--font-eng);
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.82rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .header-banner h1 {
            font-family: var(--font-eng);
            font-size: 2.3rem;
            font-weight: 900;
            color: var(--text-heading);
            letter-spacing: -0.5px;
            text-transform: uppercase;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .sub-tagline {
            font-family: var(--font-eng);
            font-size: 1.05rem;
            color: var(--brand-primary);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .content-body {
            padding: 36px;
        }

        .greeting-block {
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid var(--brand-primary);
            padding: 20px 24px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 28px;
        }

        .salutation {
            font-family: var(--font-eng);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--brand-primary);
            margin-bottom: 8px;
        }

        .problem-statement {
            font-size: 1.02rem;
            color: var(--text-body);
        }

        .problem-statement strong {
            color: #ffffff;
            font-weight: 600;
        }

        /* Callout Box */
        .alert-callout {
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.12) 0%, rgba(245, 158, 11, 0.08) 100%);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 18px 22px;
            margin-bottom: 32px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .alert-icon {
            font-size: 1.4rem;
            line-height: 1;
        }

        .alert-text {
            font-size: 0.98rem;
            color: #fecaca;
        }

        .alert-text strong {
            color: #ffffff;
            font-weight: 700;
        }

        /* Key Features Grid */
        .section-header {
            font-family: var(--font-hindi-body);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 10px;
        }

        .features-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .feature-item {
            background: var(--card-surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            gap: 18px;
            transition: all 0.25s ease;
        }

        .feature-item:hover {
            border-color: var(--border-highlight);
            transform: translateY(-2px);
        }

        .feature-number {
            font-family: var(--font-eng);
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--brand-secondary);
            background: rgba(245, 158, 11, 0.1);
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-details h3 {
            font-family: var(--font-eng);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 4px;
        }

        .feature-details p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
